version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dezai_postgres
    environment:
      POSTGRES_USER: dezai
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dezai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
